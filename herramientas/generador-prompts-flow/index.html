<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de prompts para Google Flow</title>
  <meta name="description" content="Asistente conversacional que te guía, pregunta por pregunta, para armar un prompt cinematográfico para Google Flow.">
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --ink: #1d1d1f;
      --muted: #6b6b72;
      --line: #e2e0da;
      --accent: #2f5bd3;
      --accent-soft: #e8eefc;
      --warn: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
    .progreso { display: flex; gap: 6px; margin-bottom: 16px; }
    .progreso span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
    .progreso span.hecho { background: var(--accent); }
    .progreso span.actual { background: #8fa9ea; }
    .chat { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .msg { max-width: 92%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
    .msg p { margin: 0 0 8px; }
    .msg p:last-child { margin-bottom: 0; }
    .msg .nota { color: var(--muted); font-size: .9rem; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .panel h3 { font-size: 1rem; margin: 14px 0 6px; }
    .panel h3:first-child { margin-top: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 13px;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }
    .chip small { display: block; color: var(--muted); font: .74rem ui-monospace, Menlo, Consolas, monospace; }
    .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .chip[aria-pressed="true"] small { color: var(--accent); }
    .campo {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      resize: vertical;
    }
    .campo:focus, .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .acciones { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 18px;
      font: inherit;
      cursor: pointer;
    }
    .btn.primario { background: var(--accent); border-color: var(--accent); color: #fff; }
    .aviso { color: var(--warn); font-size: .9rem; min-height: 1.4em; margin-top: 10px; }
    .codigo { position: relative; margin-top: 10px; }
    .codigo pre {
      margin: 0;
      padding: 14px;
      background: #15161a;
      color: #f2f2f4;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      font: .92rem/1.6 ui-monospace, Menlo, Consolas, monospace;
    }
    .codigo .btn { margin-top: 10px; }
    .atajos { font: .85rem ui-monospace, Menlo, Consolas, monospace; color: var(--accent); word-break: break-word; }
    @media (max-width: 480px) {
      .panel { padding: 14px; }
      .msg { max-width: 100%; }
      .acciones .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Generador de prompts para Google Flow</h1>
    <p class="sub">Respondé una pregunta por vez. Al final obtenés un prompt listo para pegar.</p>
    <div class="progreso" id="progreso" aria-hidden="true"></div>
    <section class="chat" id="chat" aria-live="polite"></section>
    <section class="panel" id="panel"></section>
  </main>

  <script>
    // Catálogo de atajos "/" del documento de referencia. Son recursos de redacción;
    // el prompt final los traduce a lenguaje natural, porque Flow no documenta un lenguaje de comandos.
    const CATALOGO = {
      closeup: { nom: 'Primer plano', cmd: '/closeup', nota: 'emoción y detalle', en: 'close-up shot', es: 'primer plano del sujeto' },
      wideangle: { nom: 'Plano abierto', cmd: '/wideangle', nota: 'más entorno en cuadro', en: 'wide-angle shot', es: 'plano abierto con gran angular' },
      establishing: { nom: 'Plano de situación', cmd: '/establishing', nota: 'presenta el lugar', en: 'establishing shot', es: 'plano de situación del lugar' },
      lowangle: { nom: 'Contrapicado', cmd: '/lowangle', nota: 'poder y escala', en: 'low-angle shot', es: 'contrapicado (cámara por debajo del sujeto)' },
      highangle: { nom: 'Picado', cmd: '/highangle', nota: 'contexto y vulnerabilidad', en: 'high-angle shot', es: 'picado (cámara por encima del sujeto)' },
      overhead: { nom: 'Cenital', cmd: '/overhead', nota: 'vista desde arriba', en: 'overhead top-down view', es: 'vista cenital' },
      pov: { nom: 'Punto de vista', cmd: '/pov', nota: 'narrativa inmersiva', en: 'first-person point-of-view shot', es: 'punto de vista subjetivo' },
      droneview: { nom: 'Vista aérea', cmd: '/droneview', nota: 'paisajes y ciudades', en: 'aerial drone-style view', es: 'vista aérea tipo dron' },
      orbit: { nom: 'Órbita', cmd: '/orbit', nota: 'revelar desde varios ángulos', en: 'the camera orbits around the subject', es: 'la cámara orbita alrededor del sujeto', mov: true },
      dollyin: { nom: 'Acercarse', cmd: '/dollyin', nota: 'tensión que crece', en: 'the camera slowly dollies in toward the subject', es: 'la cámara avanza lentamente hacia el sujeto', mov: true },
      tracking: { nom: 'Seguimiento', cmd: '/tracking', nota: 'seguir a un sujeto en movimiento', en: 'the camera tracks alongside the moving subject', es: 'la cámara acompaña al sujeto en movimiento', mov: true },
      craneup: { nom: 'Grúa ascendente', cmd: '/craneup', nota: 'revelaciones', en: 'the camera cranes upward', es: 'la cámara sube como en una grúa', mov: true },
      steadicam: { nom: 'Steadicam', cmd: '/steadicam', nota: 'recorridos fluidos', en: 'smooth, stabilized steadicam-style movement', es: 'movimiento fluido y estabilizado', mov: true },
      slowmo: { nom: 'Cámara lenta', cmd: '/slowmotion', nota: 'momentos dramáticos', en: 'in visible slow motion', es: 'con movimiento visiblemente ralentizado', mov: true },
      static: { nom: 'Cámara fija', en: 'static, locked-off camera', es: 'cámara fija, sin movimiento', mov: true }
    };

    const LUCES = {
      goldenhour: { nom: 'Hora dorada', cmd: '/goldenhour', en: 'warm, soft golden-hour light', es: 'luz dorada, cálida y suave' },
      moody: { nom: 'Atmosférica oscura', cmd: '/moody', en: 'dark, moody atmospheric lighting', es: 'iluminación oscura y atmosférica' },
      neonlight: { nom: 'Neón', cmd: '/neonlight', en: 'colorful neon lighting', es: 'iluminación de neón de colores' },
      volumetric: { nom: 'Luz volumétrica', cmd: '/volumetric', en: 'visible volumetric light shafts through atmospheric haze', es: 'rayos de luz visibles que atraviesan la atmósfera' }
    };

    const PALETAS = {
      calida: { nom: 'Cálida', en: 'warm color palette', es: 'paleta cálida' },
      fria: { nom: 'Fría', en: 'cool color palette', es: 'paleta fría' },
      desat: { nom: 'Desaturada', en: 'muted, desaturated colors', es: 'colores apagados y desaturados' },
      vibrante: { nom: 'Vibrante', en: 'vivid, energetic colors', es: 'colores vívidos y energéticos' },
      bw: { nom: 'Blanco y negro', en: 'black-and-white treatment', es: 'tratamiento en blanco y negro' }
    };

    const FORMATOS = {
      vertical: { nom: 'Vertical 9:16', nota: 'Reels, Stories, TikTok', en: 'vertical 9:16 framing', es: 'encuadre vertical 9:16' },
      horizontal: { nom: 'Horizontal 16:9', nota: 'YouTube, web', en: 'horizontal 16:9 framing', es: 'encuadre horizontal 16:9' },
      cuadrado: { nom: 'Cuadrado 1:1', nota: 'feed', en: 'square 1:1 framing', es: 'encuadre cuadrado 1:1' }
    };

    // Sugerencias contextuales: se eligen según lo que describió el usuario en la escena.
    function sugerenciasCamara(escena) {
      const t = escena.toLowerCase();
      if (/producto|botella|reloj|zapatilla|perfume|celular|comida|plato|objeto/.test(t)) return ['orbit', 'dollyin', 'closeup'];
      if (/camina|corr|cicl|auto|moto|bici|atleta|persona|caballo|nadad/.test(t)) return ['tracking', 'steadicam', 'slowmo'];
      if (/paisaje|ciudad|monta|mar|playa|valle|edificio|bosque|desierto|calle/.test(t)) return ['droneview', 'craneup', 'establishing'];
      return ['orbit', 'dollyin', 'lowangle'];
    }

    const answers = { escena: '', formato: null, camara: null, camaraTexto: '', luz: null, paleta: null, animo: '' };
    let fase = 0;
    let historia = [];
    let aviso = '';

    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    const limpia = (s) => (s || '').trim().replace(/\s+/g, ' ');
    const punto = (s) => (!s ? '' : /[.!?]$/.test(s) ? s : s + '.');
    const mayus = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');

    function chip(key, id, nom, cmd, nota) {
      const activo = answers[key] === id;
      const sub = cmd || nota ? `<small>${esc([cmd, nota].filter(Boolean).join(' · '))}</small>` : '';
      return `<button type="button" class="chip" data-key="${key}" data-id="${id}" aria-pressed="${activo}">${esc(nom)}${sub}</button>`;
    }

    function construirPrompt() {
      const partes = ['A cinematic shot.'];
      const escena = limpia(answers.escena);
      if (escena) partes.push(punto(mayus(escena)));

      const angulos = [];
      const movimientos = [];
      if (answers.camara === 'otro') {
        const texto = limpia(answers.camaraTexto);
        if (texto) angulos.push(texto);
      } else if (answers.camara) {
        const c = CATALOGO[answers.camara];
        if (c.mov) movimientos.push(c.en); else angulos.push(c.en);
      }
      if (angulos.length) partes.push(punto(mayus(angulos.join(', '))));
      if (movimientos.length) partes.push(punto(mayus(movimientos.join(', '))));

      if (answers.luz) partes.push(punto(`Lighting: ${LUCES[answers.luz].en}`));
      if (answers.paleta) partes.push(punto(mayus(PALETAS[answers.paleta].en)));

      const animo = limpia(answers.animo);
      if (animo) partes.push(punto(`Mood: ${animo}`));

      if (answers.formato) partes.push(punto(mayus(FORMATOS[answers.formato].en)));
      return partes.join(' ');
    }

    const chipsCamara = () => {
      const ids = sugerenciasCamara(answers.escena);
      return `<div class="chips">${ids.map((id) => chip('camara', id, CATALOGO[id].nom, CATALOGO[id].cmd, CATALOGO[id].nota)).join('')}
        ${chip('camara', 'otro', 'Lo escribo yo')}</div>`;
    };

    const FASES = [
      {
        mensaje: () => 'Hola, soy tu Ingeniero de Prompts y Editor de Video, especializado en Google Flow. Te voy a guiar paso a paso, con una sola pregunta por turno, para no abrumarte.\n\n**Pregunta 1:** ¿Cuál es el sujeto principal, qué acción realiza y en qué entorno ocurre?',
        panel: () => `<h3>Tu escena</h3>
          <textarea class="campo" rows="3" data-campo="escena" placeholder="Ej.: una ciclista atraviesa un bosque nevado al amanecer, pedaleando entre los árboles">${esc(answers.escena)}</textarea>`,
        valida: () => (limpia(answers.escena) ? '' : 'Contame al menos el sujeto y la acción para seguir.'),
        resumen: () => `Escena: ${limpia(answers.escena)}`
      },
      {
        mensaje: () => {
          const ids = sugerenciasCamara(answers.escena);
          const lista = ids.map((id) => `${CATALOGO[id].cmd} (${CATALOGO[id].nota})`).join(', ');
          return `Gracias. **Pregunta 2:** ¿qué formato necesitás y qué movimiento o ángulo de cámara imaginás?\n\nPara tu escena te sugiero ${lista}. Elegí un solo movimiento principal: si la cámara se acerca y se aleja a la vez, el modelo no sabe qué mostrar.`;
        },
        panel: () => `<h3>Formato</h3>
          <div class="chips">${Object.entries(FORMATOS).map(([id, f]) => chip('formato', id, f.nom, null, f.nota)).join('')}</div>
          <h3>Cámara</h3>${chipsCamara()}
          ${answers.camara === 'otro' ? `<textarea class="campo" rows="2" data-campo="camaraTexto" placeholder="Ej.: la cámara sube desde el suelo hasta mostrar el paisaje completo">${esc(answers.camaraTexto)}</textarea>` : ''}`,
        valida: () => {
          if (!answers.formato) return 'Elegí un formato.';
          if (!answers.camara) return 'Elegí una opción de cámara.';
          if (answers.camara === 'otro' && !limpia(answers.camaraTexto)) return 'Describí la cámara que imaginás.';
          return '';
        },
        resumen: () => `Formato: ${FORMATOS[answers.formato].nom} · Cámara: ${answers.camara === 'otro' ? limpia(answers.camaraTexto) : CATALOGO[answers.camara].nom}`
      },
      {
        mensaje: () => '**Pregunta 3:** ¿qué tipo de iluminación, paleta de colores y estado de ánimo querés transmitir?\n\nComo ejemplos, `/goldenhour` para escenas cálidas y naturales, `/moody` para dramatismo o `/neonlight` para lo urbano y colorido.',
        panel: () => `<h3>Iluminación</h3>
          <div class="chips">${Object.entries(LUCES).map(([id, l]) => chip('luz', id, l.nom, l.cmd)).join('')}</div>
          <h3>Paleta de colores</h3>
          <div class="chips">${Object.entries(PALETAS).map(([id, p]) => chip('paleta', id, p.nom)).join('')}</div>
          <h3>Estado de ánimo</h3>
          <textarea class="campo" rows="2" data-campo="animo" placeholder="Ej.: nostalgia tranquila, o tensión creciente">${esc(answers.animo)}</textarea>`,
        valida: () => (answers.luz ? '' : 'Elegí una iluminación para seguir.'),
        resumen: () => `Luz: ${LUCES[answers.luz].nom}${answers.paleta ? ' · Paleta: ' + PALETAS[answers.paleta].nom : ''}${limpia(answers.animo) ? ' · Ánimo: ' + limpia(answers.animo) : ''}`
      }
    ];

    function mensajeBot(texto) {
      return { rol: 'bot', html: `<p>${fmt(texto)}</p>` };
    }

    function mensajeFinal() {
      const prompt = construirPrompt();
      const cmds = ['camara', 'luz']
        .map((k) => (k === 'camara' ? answers.camara && answers.camara !== 'otro' && CATALOGO[answers.camara].cmd : answers.luz && LUCES[answers.luz].cmd))
        .filter(Boolean);
      return {
        rol: 'bot',
        html: `<p>Listo. Sintetizé tu escena, la cámara, la luz y el ánimo en un solo prompt. Copialo y pegalo en Flow:</p>
          <div class="codigo"><pre><code id="prompt-final">${esc(prompt)}</code></pre>
          <button type="button" class="btn primario" data-accion="copiar">Copiar prompt</button></div>
          <p class="nota">Los atajos con barra (${esc(cmds.join(' ') || 'ninguno')}) se tradujeron a descripciones en lenguaje natural, porque Flow no documenta un lenguaje de comandos. Lo que escribiste en la escena se usó tal cual: si lo escribiste en español, conviene traducirlo al inglés para un resultado más consistente.</p>`
      };
    }

    function render() {
      const total = FASES.length;
      document.getElementById('progreso').innerHTML = FASES
        .map((_, i) => `<span class="${i < fase ? 'hecho' : i === fase ? 'actual' : ''}"></span>`).join('');

      document.getElementById('chat').innerHTML = historia
        .map((m) => `<div class="msg ${m.rol}">${m.html}</div>`).join('');

      const panel = document.getElementById('panel');
      if (fase < total) {
        const f = FASES[fase];
        panel.innerHTML = `${f.panel()}
          <div class="aviso" role="status">${esc(aviso)}</div>
          <div class="acciones">
            <button type="button" class="btn" data-accion="reiniciar">Empezar de nuevo</button>
            <button type="button" class="btn primario" data-accion="enviar">Enviar respuesta</button>
          </div>`;
      } else {
        panel.innerHTML = `<div class="acciones"><span class="nota">Conversación completa.</span>
          <button type="button" class="btn" data-accion="reiniciar">Empezar de nuevo</button></div>`;
      }
      aviso = '';
    }

    function enviar() {
      const f = FASES[fase];
      const error = f.valida();
      if (error) { aviso = error; render(); return; }
      historia.push({ rol: 'user', html: `<p>${esc(f.resumen())}</p>` });
      fase += 1;
      if (fase < FASES.length) historia.push(mensajeBot(FASES[fase].mensaje()));
      else historia.push(mensajeFinal());
      render();
    }

    function reiniciar() {
      Object.assign(answers, { escena: '', formato: null, camara: null, camaraTexto: '', luz: null, paleta: null, animo: '' });
      fase = 0;
      historia = [mensajeBot(FASES[0].mensaje())];
      aviso = '';
      render();
    }

    function copiar() {
      const codigo = document.getElementById('prompt-final');
      const texto = codigo.textContent;
      const seleccionar = () => {
        const rango = document.createRange();
        rango.selectNodeContents(codigo);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(rango);
      };
      const confirmar = () => { aviso = '✓ Prompt copiado. Pegalo en Flow.'; render(); };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(texto).then(confirmar, () => { seleccionar(); aviso = 'Seleccioná el texto y copialo con Ctrl+C.'; render(); });
      } else {
        seleccionar();
        aviso = 'Seleccioná el texto y copialo con Ctrl+C.';
        render();
      }
    }

    const panel = document.getElementById('panel');

    panel.addEventListener('click', (e) => {
      const opcion = e.target.closest('[data-id]');
      if (opcion) {
        const { key, id } = opcion.dataset;
        answers[key] = answers[key] === id ? null : id;
        render();
        return;
      }
      const accion = e.target.closest('[data-accion]');
      if (!accion) return;
      if (accion.dataset.accion === 'enviar') enviar();
      if (accion.dataset.accion === 'reiniciar') reiniciar();
    });

    panel.addEventListener('input', (e) => {
      const campo = e.target.dataset.campo;
      if (campo) answers[campo] = e.target.value;
    });

    document.getElementById('chat').addEventListener('click', (e) => {
      if (e.target.closest('[data-accion="copiar"]')) copiar();
    });

    reiniciar();
  </script>
</body>
</html>
